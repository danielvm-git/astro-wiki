# story: e02s01
name: Deploy

on:
  workflow_run:
    workflows: ["Test Build Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: https://danielvm-git.github.io/astro-wiki
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build & deploy-meta.json boundary artifact
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::Build artifact missing or empty"
            exit 1
          fi
          if [ -f dist/deploy-meta.json ]; then
            echo "deploy-meta.json verified:"
            cat dist/deploy-meta.json
          else
            echo "WARN: deploy-meta.json boundary artifact absent"
          fi
          echo "Artifact verified: $(find dist -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-Deploy Health Check
        run: |
          SITE_URL="https://danielvm-git.github.io/astro-wiki"
          echo "Starting post-deploy health check against $SITE_URL..."
          for i in 1 2 3 4 5 6 7 8; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "PASS: Site LIVE (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/8: HTTP $STATUS, waiting 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 8 attempts"
          exit 1
